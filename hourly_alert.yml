name: BTC Hourly Alert Bot

on:
  schedule:
    # 매시간 정각 실행 (UTC 기준)
    - cron: '0 * * * *'

  # GitHub에서 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-market:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 가져오기
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: 파이썬 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 비트코인 분석 및 텔레그램 전송
      - name: 비트코인 1시간봉 분석 및 텔레그램 전송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python check_once.py
